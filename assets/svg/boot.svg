<svg width="900" height="650" viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">

<defs>

    <filter id="glow">
        <feGaussianBlur stdDeviation="2" result="blur"/>
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

</defs>


<rect width="100%" height="100%" fill="#050505"/>


<style>

text {
    fill:#00ff41;
    font-family:"Fira Code", "Courier New", monospace;
    filter:url(#glow);
}

.title {
    font-size:50px;
    font-weight:bold;
}

.line {
    font-size:24px;
}

.small {
    font-size:20px;
}

</style>


<!-- SYSTEM TITLE -->

<text x="450" y="60" text-anchor="middle" class="title">
TCOTTLE.OS

<animate
attributeName="opacity"
values="0;1"
dur="1s"
begin="0s"
fill="freeze"/>

</text>


