<svg width="1000" height="420" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg">

  <rect width="100%" height="100%" fill="#050505"/>

  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .terminal {
      font-family: 'Courier New', monospace;
      fill: #00ff41;
      filter: url(#glow);
    }

    .title {
      font-size: 52px;
      font-weight: bold;
    }

    .line {
      font-size: 24px;
    }

    .cursor {
      animation: blink 1s steps(2) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>

  <text x="50%" y="80" text-anchor="middle" class="terminal title">
    TCOTTLE.OS
  </text>

  <text x="70" y="150" class="terminal line">
    &gt; Booting Kernel...
  </text>

  <text x="70" y="185" class="terminal line">
    &gt; Initializing AI Core...
  </text>

  <text x="70" y="220" class="terminal line">
    &gt; Connecting Local Models...
  </text>

  <text x="70" y="255" class="terminal line">
    &gt; Starting MCP Services...
  </text>

  <text x="70" y="290" class="terminal line">
    &gt; Authenticating Operator...
  </text>

  <text x="70" y="340" class="terminal line">
    Welcome back, Thomas.
  </text>

  <text x="70" y="380" class="terminal line">
    There's No Place Like 127.0.0.1
    <tspan class="cursor">█</tspan>
  </text>

</svg>