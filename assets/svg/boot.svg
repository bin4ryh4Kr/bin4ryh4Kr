<svg width="900" height="750" viewBox="0 0 900 750" xmlns="http://www.w3.org/2000/svg">

<defs>

<filter id="glow">
  <feGaussianBlur stdDeviation="2" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

</defs>


<rect width="100%" height="100%" fill="#050505"/>


<style>

text {
  fill:#00ff41;
  font-family:"Fira Code", monospace;
  filter:url(#glow);
}

.title {
  font-size:52px;
  font-weight:bold;
}

.line {
  font-size:24px;
}

.small {
  font-size:20px;
}

.role {
  font-size:28px;
  font-weight:bold;
}

.cursor {
  animation:blink 1s steps(2) infinite;
}

@keyframes blink {
  50% {
    opacity:0;
  }
}

</style>


<!-- SYSTEM TITLE -->

<text 
x="450"
y="65"
text-anchor="middle"
class="title">
TCOTTLE.OS
</text>


<!-- BOOT SEQUENCE -->

<text x="40" y="130" class="line">
[ OK ] Initializing Kernel

<animate
attributeName="opacity"
from="0"
to="1"
dur="0.5s"
begin="0s"
fill="freeze"/>
</text>


<text x="40" y="175" class="line">
[ OK ] Loading AI Core

<animate
attributeName="opacity"
from="0"
to="1"
dur="0.5s"
begin="0.6s"
fill="freeze"/>
</text>


<text x="40" y="220" class="line">
[ OK ] Connecting Local Models

<animate
attributeName="opacity"
from="0"
to="1"
dur="0.5s"
begin="1.2s"
fill="freeze"/>
</text>


<text x="40" y="265" class="line">
[ OK ] Starting MCP Services

<animate
attributeName="opacity"
from="0"
to="1"
dur="0.5s"
begin="1.8s"
fill="freeze"/>
</text>


<text x="40" y="310" class="line">
[ OK ] Authenticating Operator

<animate
attributeName="opacity"
from="0"
to="1"
dur="0.5s"
begin="2.4s"
fill="freeze"/>
</text>



<!-- CORE IDENTITY -->

<text x="40" y="370" class="line">
[ OK ] Cognitive Core ........ ONLINE
</text>

<text x="40" y="410" class="line">
[ OK ] Thinker ............... ACTIVE
</text>

<text x="40" y="450" class="line">
[ OK ] AI Builder ............ ONLINE
</text>

<text x="40" y="490" class="line">
[ OK ] Systems Architect ..... READY
</text>

<text x="40" y="530" class="line">
[ OK ] Full Stack Developer .. ACTIVE
</text>

<text x="40" y="570" class="line">
[ OK ] Security Researcher ... ACTIVE
</text>

<text x="40" y="610" class="line">
[ OK ] Reverse Engineer ...... ACTIVE
</text>

<!-- SCROLLING IDENTITY MODULE -->

<clipPath id="roleWindow">
  <rect x="0" y="630" width="900" height="50"/>
</clipPath>


<g clip-path="url(#roleWindow)">

<text
x="900"
y="665"
class="role">

THINKER // AI BUILDER // SYSTEMS ARCHITECT // FULL STACK DEVELOPER // SECURITY RESEARCHER // REVERSE ENGINEER // UX ENGINEER // AUTOMATION ARCHITECT // LOCAL AI EGINEER // MOBILE DEVELOPER // CLOUD ENGINEER

<animate
attributeName="x"
from="900"
to="-3600"
dur="35s"
repeatCount="indefinite"/>

</text>

</g>

<!-- TERMINAL FOOTER -->

<text x="40" y="710" class="small">
127.0.0.1 // HOME DIRECTORY FOUND
<tspan class="cursor">█</tspan>
</text>


</svg>

